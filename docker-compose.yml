version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: puntored
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proyecto-core:0.1
    container_name: proyecto-core-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/puntored
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GESTOPAGO_AUTH_URL=https://gestopago.portalventas.net
      - GESTOPAGO_AUTH_ID_DISTRIBUIDOR=83
      - GESTOPAGO_AUTH_CODIGO_DISPOSITIVO=GPS83-TPV-17
      - GESTOPAGO_AUTH_PASSWORD=12345678
      - GESTOPAGO_AUTH_API_KEY=YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8
      - GESTOPAGO_PRODUCTOS_REFRESH_RATE_MS=86400000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
