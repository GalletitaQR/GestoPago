# 1. Configuración de Puerto del Servidor (Render detecta $PORT automáticamente)
server.port=${PORT:8080}
spring.cloud.config.enabled=false

# 2. Configuración de PostgreSQL (soporta SPRING_DATASOURCE_URL, DATABASE_URL o fallback local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/puntored}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${RING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:admin}}

# 3. Configuración del servicio GestoPago
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_AUTH_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_AUTH_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:12345678}
gestopago.auth.api-key=${GESTOPAGO_AUTH_API_KEY:YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8}

# 4. Tasa de sincronización diaria de productos (24 horas = 86400000 ms)
gestopago.productos.refresh-rate-ms=${GESTOPAGO_PRODUCTOS_REFRESH_RATE_MS:86400000}

# 5. Configuración de Redis (soporta URL para flexibilidad con localhost y servicios Cloud)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}